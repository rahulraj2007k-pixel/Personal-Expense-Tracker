 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Personal Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Personal Expense Tracker</h1>

            <h2>Welcome Back</h2>

            <p class="auth-subtitle">
                Login to manage your finances
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <p
                    id="message"
                    class="message"
                ></p>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Login
                </button>

            </form>


            <!-- REGISTER LINK -->

            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <!-- AUTH JAVASCRIPT -->

    <script src="js/auth.js"></script>

</body>
</html>
