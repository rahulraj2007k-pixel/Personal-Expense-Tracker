 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal Expense Tracker</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            Personal Expense Tracker
        </div>


        <nav class="nav-links">

            <a
                href="index.html"
                class="nav-link active"
            >
                Dashboard
            </a>


            <a
                href="transactions.html"
                class="nav-link"
            >
                Transactions
            </a>

        </nav>


        <div class="nav-right">

            <span id="userName"></span>


            <button
                id="logoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">


        <h1>
            Dashboard
        </h1>


        <p class="subtitle">
            Welcome back! Here's your financial summary.
        </p>


        <!-- ================= SUMMARY ================= -->

        <section class="summary">


            <div class="summary-card">

                <h3>
                    Total Income
                </h3>

                <p id="totalIncome">
                    ₹0
                </p>

            </div>


            <div class="summary-card">

                <h3>
                    Total Expenses
                </h3>

                <p id="totalExpense">
                    ₹0
                </p>

            </div>


            <div class="summary-card">

                <h3>
                    Balance
                </h3>

                <p id="balance">
                    ₹0
                </p>

            </div>


        </section>


        <!-- ================= ADD TRANSACTION ================= -->

        <section class="transaction-form">


            <h2>
                Add Transaction
            </h2>


            <form id="transactionForm">


                <div class="form-grid">


                    <!-- TYPE -->

                    <div class="form-group">

                        <label for="type">
                            Type
                        </label>


                        <select
                            id="type"
                            required
                        >

                            <option value="">
                                Select Type
                            </option>

                            <option value="income">
                                Income
                            </option>

                            <option value="expense">
                                Expense
                            </option>

                        </select>

                    </div>


                    <!-- AMOUNT -->

                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>


                        <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            min="1"
                            required
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>


                        <input
                            type="text"
                            id="category"
                            placeholder="Food, Salary, Travel..."
                            required
                        >

                    </div>


                    <!-- DATE -->

                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>


                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group full-width">

                        <label for="description">
                            Description
                        </label>


                        <input
                            type="text"
                            id="description"
                            placeholder="Short description"
                        >

                    </div>


                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Add Transaction
                </button>


            </form>


            <p
                id="transactionMessage"
                class="message"
            ></p>


        </section>


        <!-- ================= EXPENSE CHART ================= -->

        <section class="transaction-list">


            <h2>
                Expenses by Category
            </h2>


            <div
                style="
                    max-width: 600px;
                    margin: 20px auto;
                "
            >

                <canvas id="expenseChart"></canvas>

            </div>


        </section>


        <!-- ================= TRANSACTIONS ================= -->

        <section class="transaction-list">


            <h2>
                Recent Transactions
            </h2>


            <div
                id="transactionsContainer"
            >

                <p id="noTransactions">
                    No transactions found.
                </p>

            </div>


            <div
                style="
                    text-align: center;
                    margin-top: 20px;
                "
            >

                <a
                    href="transactions.html"
                    class="primary-btn"
                    style="
                        display: inline-block;
                        text-decoration: none;
                    "
                >
                    View All Transactions
                </a>

            </div>


        </section>


    </main>


    <!-- ================= CHART.JS ================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>


    <!-- ================= DASHBOARD JS ================= -->

    <script
        src="js/dashboard.js"
    ></script>


</body>

</html>
